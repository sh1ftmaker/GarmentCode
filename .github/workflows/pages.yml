name: Deploy web configurator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build site
        run: bash web/tools/build_site.sh
      # Experimental simulator branch, served at /lab/
      - name: Check out sim-lab branch
        id: lab
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: sim-lab
          path: lab-src
      - name: Build lab site
        if: steps.lab.outcome == 'success'
        run: |
          (cd lab-src/web && npm install --no-audit --no-fund)
          bash lab-src/web/tools/build_site.sh
          mv lab-src/_site _site/lab
      # Frozen snapshot (branch legacy, right after the gored-skirt placement fix), at /legacy/
      - name: Check out legacy branch
        id: legacy
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: legacy
          path: legacy-src
      - name: Build legacy site
        if: steps.legacy.outcome == 'success'
        run: |
          (cd legacy-src/web && npm install --no-audit --no-fund)
          bash legacy-src/web/tools/build_site.sh
          # no service worker: its old cache strategy would fight the main site's cache
          rm -f legacy-src/_site/sw.js
          mv legacy-src/_site _site/legacy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
